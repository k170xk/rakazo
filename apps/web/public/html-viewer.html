// through what it captured first, which the page cannot redefine. Every such gesture lets the page
// ask the app for one action, right after it.

  // nothing else anyway.

    } else if (data && data.type === "rakazo-page:reply" && typeof data.text === "string") {

    } else if (data && data.type === "rakazo-page:copy" && typeof data.id === "string" && typeof data.text === "string") {

    return;

  if (event.data && (event.data.type === "ocsc-app:response" || event.data.type === "ocsc-app:event")) {
