# TCP relay from the stack's private address to its database and document runners.
# Long timeouts keep pooled and listening database connections open while idle.
global
  log stdout format raw local0

defaults
  mode tcp
  log global
  option clitcpka
  option srvtcpka
  timeout connect 5s
  timeout client 7d
  timeout server 7d

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 10s

frontend database
  bind :5432
  default_backend database

backend database
  server postgres postgres:5432 resolvers docker init-addr none

frontend runners
  bind :7091
  default_backend runners

backend runners
  server supervisor supervisor:7091 resolvers docker init-addr none
